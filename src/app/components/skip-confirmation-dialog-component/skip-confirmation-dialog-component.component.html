<h2 mat-dialog-title>Confirmation</h2>
<div mat-dialog-content>
  <p>{{ message }}</p>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="confirm()" *ngIf="!showHideButton">Yes</button>
  <button mat-button (click)="cancel()" *ngIf="!showHideButton">No</button>
  <button mat-button mat-dialog-close *ngIf="showHideButton">Cancel</button>
</div>
